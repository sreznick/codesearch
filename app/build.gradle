 */

plugins {
    // Apply the application plugin to add support for building a CLI application in Java.
    id 'application'
    id 'antlr'
}

repositories {
    // Use Maven Central for resolving dependencies.
    mavenCentral()
}

dependencies {
    // Use JUnit Jupiter for testing.
    testImplementation libs.junit.jupiter

    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'

    // This dependency is used by the application.
    implementation libs.guava

    implementation 'org.antlr:antlr4-runtime:4.13.2'

    antlr "org.antlr:antlr4:4.13.2" // use ANTLR version 4

    implementation 'org.apache.lucene:lucene-core:10.0.0'
    implementation 'org.apache.lucene:lucene-queryparser:10.0.0'
    implementation 'org.apache.lucene:lucene-analysis-common:10.0.0'
    implementation('org.apache.logging.log4j:log4j-core:2.23.1')
    implementation('org.apache.logging.log4j:log4j-api:2.23.1')
}

// Apply a specific Java toolchain to ease working on different environments.
java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

def luceneRuntimeJvmArgs = [
        '--enable-native-access=ALL-UNNAMED',
        '-Djava.util.logging.config.file=$APP_HOME/config/java-logging.properties'
]

application {
    // Define the main class for the application.
    mainClass = 'org.codesearch.App'
    applicationName = 'codesearch'
    applicationDefaultJvmArgs = luceneRuntimeJvmArgs
}

jar {
    manifest {
        attributes(
                'Main-Class': 'org.codesearch.App'
        )
    }
}

tasks.named('test') {
    // Use JUnit Platform for unit tests.
    useJUnitPlatform()
    jvmArgs luceneRuntimeJvmArgs
}

tasks.named('run') {
    standardInput = System.in
    jvmArgs '--enable-native-access=ALL-UNNAMED',
            "-Djava.util.logging.config.file=${layout.projectDirectory.file('config/java-logging.properties').asFile.absolutePath}"
}

distributions {
    main {
        distributionBaseName = 'codesearch'
        contents {
            from('config') {
                into 'config'
            }
        }
    }
}

tasks.named('distZip') {
    archiveFileName = 'codesearch.zip'
}

generateGrammarSource {
    maxHeapSize = "64m"
    arguments += [ "-visitor",
                   "-long-messages",
                   "-package", "org.example" ]
}
